<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャスト一覧</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .contact-icons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            justify-content: center;
            margin: 20px 0;
        }
        .contact-icons a {
            display: block;
            text-align: center;
            width: 100px;
            font-size: 12px;
            color: #028e12;
        }
        .contact-icons img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        @media (max-width: 600px) {
            .contact-icons {
                grid-template-columns: repeat(2, 1fr);
            }
            .contact-icons img {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>キャスト一覧</h1>
</header>

<div class="contact-icons" id="Cast-list"></div>

<script>
    const statuses = ["待機中", "取り込み中", "離席中", "オフライン"];
    
    // 初期状態
    let CastStatuses = {
        "Cast_A": 0, // 待機中
        "Cast_B": 0, // 待機中
        "Cast_C": 0  // 待機中
    };

    const users = [
        {name: "Cast_A", img: "icon_images1.jpg", link: "https://s-all11.github.io/Test-open-view/Cast_chat_1.html"},
        {name: "Cast_B", img: "icon_images2.jpg", link: "https://s-all11.github.io/Test-open-view/Cast_chat_2.html"},
        {name: "Cast_C", img: "icon_images3.png", link: "https://s-all11.github.io/Test-open-view/Cast_chat_3.html"}
    ];

    // キャストリストを描画
    function renderCastList() {
        const CastList = document.getElementById("Cast-list");
        CastList.innerHTML = ""; // リストを初期化
        users.forEach(user => {
            const statusText = statuses[CastStatuses[user.name]];
            CastList.innerHTML += `
                <a href="${user.link}" target="_blank">
                    <img src="${user.img}" alt="${user.name} icon">
                    ${user.name}
                    <br><span>${statusText}</span>
                </a>
            `;
        });
    }

    // ステータス更新（ランダム更新を削除）
    function updateStatuses() {
        // 状態を再描画するだけで、CastStatuses自体を変更しない
        renderCastList();
    }

    // 初期描画
    renderCastList();

    // 1分ごとに状態を再描画
    setInterval(updateStatuses, 60000);

    // デバッグ用: 状態をコンソールで確認可能
    console.log("CastStatuses を直接編集して状態を変更できます。例: CastStatuses['Cast_A'] = 2;");
</script>

</body>
</html>
