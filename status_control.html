    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .contact-icons {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4列表示 */
            gap: 40px; /* アイコン間の間隔 */
            justify-content: center;
            margin: 20px 0;
        }
        .contact-icons a {
            display: block;
            text-align: center; /* 名前とオンライン状況を中央揃え */
            width: 100px; /* アイコン全体の幅 */
            font-size: 12px;
            color: #028e12; /* 名前とオンライン状況の文字色 */
        }
        .contact-icons img {
            width: 80px; /* アイコンのサイズ */
            height: 80px; /* アイコンのサイズ */
            object-fit: contain; /* アイコンの比率を保持 */
        }
        @media (max-width: 600px) {
            .contact-icons {
                grid-template-columns: repeat(2, 1fr); /* 小さい画面用に2列表示 */
            }
            .contact-icons img {
                width: 40px; /* 小さい画面用のアイコンサイズ */
                height: 40px; /* 小さい画面用のアイコンサイズ */
            }
        }
        header, footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header nav {
            display: flex;
            justify-content: space-around;
        }
        header nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px;
        }
        nav .logo {
            width: 50px; /* 横幅を指定 */
            height: 50px; /* 縦幅を指定 */
        }
        footer ul {
            display: flex;
            justify-content: center;
            list-style-type: none;
        }
        footer ul li {
            margin: 0 15px;
        }
        footer ul li a {
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>キャストのステータス変更</h1>
        <form id="CastStatusForm">
            <!-- キャスト A のフォーム -->
            <div class="Cast-form">
                <label for="CastAStatus">Cast_A のステータス</label>
                <select id="CastAStatus" name="CastAStatus">
                    <option value="0">待機中</option>
                    <option value="1">接客中</option>
                    <option value="2">離席中</option>
                    <option value="3">オフライン</option>
                </select>
            </div>
            <!-- キャスト B のフォーム -->
            <div class="Cast-form">
                <label for="CastBStatus">Cast_B のステータス</label>
                <select id="CastBStatus" name="CastBStatus">
                    <option value="0">待機中</option>
                    <option value="1">接客中</option>
                    <option value="2">離席中</option>
                    <option value="3">オフライン</option>
                </select>
            </div>
            <!-- キャスト C のフォーム -->
            <div class="Cast-form">
                <label for="CastCStatus">Cast_C のステータス</label>
                <select id="CastCStatus" name="CastCStatus">
                    <option value="0">待機中</option>
                    <option value="1">接客中</option>
                    <option value="2">離席中</option>
                    <option value="3">オフライン</option>
                </select>
            </div>
            <button type="button" onclick="sendStatus()">送信</button>
        </form>
    </div>

    <!-- キャストのステータス変更フォーム -->
    <script>
        function sendStatus() {
            // 各ステータスの値を取得
            const CastAStatus = document.getElementById("CastAStatus").value;
            const CastBStatus = document.getElementById("CastBStatus").value;
            const CastCStatus = document.getElementById("CastCStatus").value;

            // 送信データの作成
            const data = {
                CastA: CastAStatus,
                CastB: CastBStatus,
                CastC: CastCStatus
            };

            // データをサーバーに送信
            fetch('/update-status', { // 適切なエンドポイントに変更
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert("ステータスを更新しました。");
                console.log(result);
            })
            .catch(error => {
                alert("エラーが発生しました。");
                console.error(error);
            });
        }
    </script>
