name: Update JSON via Form

on:
  workflow_dispatch: # 手動または外部トリガーで実行
    inputs:
      status:
        description: 'New status for admin'
        required: true

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v3

    - name: JSONファイルを更新
      run: |
        echo "Updating JSON file..."
        new_status=${{ inputs.status }}
        jq --arg status "$new_status" '.status = $status' status.json > tmp.json && mv tmp.json status.json

    - name: 更新内容をコミット
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add status.json
        git commit -m "Update status to ${{ inputs.status }}"
        git push
