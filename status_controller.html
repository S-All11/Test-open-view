<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>キャストステータス更新フォーム</title>
</head>
<body>
  <h1>キャストステータス更新</h1>
  <form id="statusForm">
    <label for="status">変更したい表示内容をを選択してください:</label>
    <select id="status" name="status">
      <option value="オフライン">オフライン</option>
      <option value="待機中">待機中</option>
      <option value="休憩中">休憩中</option>
      <option value="接客中">接客中</option>
    </select>
    <button type="submit">送信</button>
  </form>

  <script>
    document.getElementById("statusForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const status = document.getElementById("status").value;

      // GitHub ActionsをトリガーするAPIリクエスト
      const response = await fetch(
        "https://api.github.com/repos/<your-username>/<your-repo>/actions/workflows/update-json.yml/dispatches",
        {
          method: "POST",
          headers: {
            "Authorization": "Bearer YOUR_PERSONAL_ACCESS_TOKEN", // アクセストークンを自分のものに書き換え
            "Accept": "application/vnd.github.v3+json"
          },
          body: JSON.stringify({
            ref: "main",
            inputs: { status: status }
          })
        }
      );

      if (response.ok) {
        alert("ステータスが更新されました！");
      } else {
        alert("ステータス更新に失敗しました。");
        console.error(await response.json());
      }
    });
  </script>
</body>
</html>
