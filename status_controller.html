<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>キャストステータス更新フォーム</title>
</head>
<body>
  <h1>キャストステータス更新</h1>
  <form id="statusForm">
    <label for="status">変更したい表示内容をを選択してください:</label>
    <select id="status" name="status">
      <option value="オフライン">オフライン</option>
      <option value="待機中">待機中</option>
      <option value="休憩中">休憩中</option>
      <option value="接客中">接客中</option>
    </select>
    <button type="submit">送信</button>
  </form>

  <script>
document.getElementById("statusForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const status = document.getElementById("status").value;

  try {
    const response = await fetch(
      "https://api.github.com/repos/S-All11/Test-open-view/actions/workflows/update-json.yml/dispatches",
      {
        method: "POST",
        headers: {
          "Authorization": "secrets.PERSONAL_ACCESS_TOKEN", // トークンをここに設定
          "Accept": "application/vnd.github.v3+json"
        },
        body: JSON.stringify({
          ref: "main",
          inputs: { status: status }
        })
      }
    );

    if (!response.ok) {
      const errorData = await response.json();
      console.error("Error details:", errorData);
      alert("ステータス更新に失敗しました。詳細はコンソールをご確認ください。");
      return;
    }

    alert("ステータスが更新されました！");
  } catch (error) {
    console.error("Fetch error:", error);
    alert("通信エラーが発生しました。");
  }
});

  </script>
</body>
</html>
